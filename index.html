<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tools Hub - Best Free AI Tools</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:15px}
h2{text-align:center}
.search{width:100%;padding:12px;border-radius:10px;border:none;background:#1e1e1e;color:#fff;margin:10px 0 15px 0;box-sizing:border-box}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:12px}
.card img{width:50px;height:50px;border-radius:12px}
.card b{font-size:16px}
.tag{background:#0088cc;padding:2px 8px;border-radius:20px;font-size:11px;margin-left:6px}
.btn{background:#fff;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:13px;display:inline-block;margin-top:8px}
</style>
</head>
<body>

<h2>🤖 AI Tools Hub</h2>
<input class="search" id="search" placeholder="Search AI tools: video, photo, homework..." onkeyup="filterTools()">

<div id="tools-list">
<!-- Tools will appear here -->
</div>

<script>
let tools = [
  {id:"1", name:"ChatGPT", logo:"https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg", tag:"FREE", desc:"Best AI for writing, homework, ideas", link:"tool.html?id=1"},
  {id:"2", name:"CapCut AI", logo:"https://i.postimg.cc/8cY7n0Xq/capcut.png", tag:"VIDEO", desc:"Auto-captions, background remover for video", link:"tool.html?id=2"},
  {id:"3", name:"Remini", logo:"https://i.postimg.cc/5tQpL0gQ/remini.png", tag:"PHOTO", desc:"Enhance old photos to HD quality", link:"tool.html?id=3"}
];

function render(list){
  document.getElementById('tools-list').innerHTML = list.map(t => `
    <div class="card">
      <img src="${t.logo}">
      <div>
        <b>${t.name}</b> <span class="tag">${t.tag}</span><br>
        <small style="color:#aaa">${t.desc}</small><br>
        <a class="btn" href="${t.link}">View Tool →</a>
      </div>
    </div>
  `).join('');
}
function filterTools(){
  let q = document.getElementById('search').value.toLowerCase();
  render(tools.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)));
}
render(tools);
Telegram.WebApp.ready();
</script>

</body>
  </html>
