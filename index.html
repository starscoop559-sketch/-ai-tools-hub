<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tools Hub - Global Free Access</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:15px}
h1{text-align:center;margin:15px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:12px;text-align:center}
.card img{width:50px;height:50px;border-radius:12px;background:#fff;padding:5px}
.card h3{margin:8px 0 4px;font-size:14px}
.card p{font-size:11px;color:#aaa;margin:0 0 8px}
.tag{background:#0088cc;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px}
.btn{background:#fff;color:#000;padding:8px;border-radius:10px;text-decoration:none;display:block;font-weight:bold;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<h1>🌍 AI Tools Hub</h1>
<p style="text-align:center;color:#aaa;font-size:13px">Global Free Access • No VPN Needed</p>
<div class="grid" id="grid"></div>
<script>
let tools=[
{id:"1",name:"ChatGPT",logo:"https://chat.openai.com/favicon.ico",tag:"FREE",desc:"Best AI for writing, homework",link:"tool.html?id=1"},
{id:"2",name:"CapCut AI",logo:"https://www.capcut.com/favicon.ico",tag:"VIDEO",desc:"Auto-captions, remover",link:"tool.html?id=2"},
{id:"3",name:"Remini AI",logo:"https://remini.ai/favicon.ico",tag:"PHOTO",desc:"Enhance photos to HD",link:"tool.html?id=3"}
];
let grid=document.getElementById('grid');
tools.forEach(t=>{
grid.innerHTML+=`<div class="card"><span class="tag">${t.tag}</span><br><img src="${t.logo}"><h3>${t.name}</h3><p>${t.desc}</p><a class="btn" href="${t.link}">View Tool →</a></div>`;
});
Telegram.WebApp.ready();
</script>
</body>
</html>
